name: Phase 1 Cache Regression

on:
  push:
    branches:
      - ours
    paths:
      - 'src/engines/provider-runtime/**'
      - '.github/workflows/phase1-cache-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run OpenRouter Claude cache regression
        run: npx vitest run src/engines/provider-runtime/providerRuntimeOpenAiCompatiblePromptCacheRegression.test.ts
