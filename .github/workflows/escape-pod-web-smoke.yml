name: Escape Pod Web Smoke

on:
  push:
    branches:
      - ours
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/escape-pod-web-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: MCP OAuth regression
        run: npx vitest run src/engines/mcpOAuth.test.ts

      - name: OpenRouter upstream forensics regression
        run: npx vitest run src/engines/provider-runtime/openRouterUpstreamDebug.test.ts

      - name: Escape Pod task gate regression
        run: npx vitest run src/engines/request/escapePodTaskGate.test.ts

      - name: Build web app
        run: npm run build
